# Shared settings: loaded on top of each method's original config.
# Every supported algorithm therefore inherits its own upstream hyperparameters
# while sharing exactly the same cyber stream and evaluation protocol.

seed: 0
stream_seed: 101
schedule_seed: 2026
participation_seed: 2027
initial_model_seed: 424242
device: cuda:0

prepared_data: data/processed/cicids2018.npz
benign_family: benign
dataset_name_for_logs: CSE-CIC-IDS2018

client_num: 20
sample_ratio: 0.50
rounds: 30
batch_size: 128

# The upstream constructors need a dataset/model recognized by their original
# factory before cyber wrappers replace it with CyberMLP.
upstream_stub_dataset: CIFAR10
upstream_stub_model: CNN
upstream_stub_num_classes: 10

hidden_dim: 256
feature_dim: 128
dropout: 0.20

stream:
  window_size: 2048
  local_test_fraction: 0.15
  # Purged chronological emerging-variant split: earliest 65% train,
  # next 5% guard, latest 30% candidate challenge, then exact feature purge.
  attack_guard_fraction: 0.05
  attack_test_fraction: 0.30
  min_window_samples: 32

threat:
  attack_family: ddos
  # Prefer one exact raw DDoS variant after running inspect_cyber_data.py.
  # null means whole-family emergence and is a harder class-support experiment.
  emerging_variant: ddos attack-hoic
  attack_mix_fraction: 0.20
  # milestones:
  #   - [0, 0.00]
  #   - [40, 0.10]
  #   - [50, 0.30]
  #   - [60, 0.50]
  #   - [70, 1.00]
  milestones:
  - [0, 0.00]
  - [10, 0.10]
  - [15, 0.30]
  - [20, 0.50]
  - [25, 1.00]

# participation:
#   normal_prob: 0.50
#   exposed_prob: 0.50
#   min_selected: 3
participation:
  normal_prob: 1.0
  exposed_prob: 1.0
  min_selected: 3

result_dir: log/cyber
run_name: "{algorithm}_ddos_propagation_seed0"
flush_every: 5
